<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amines Studied · Amine Thermo</title>
<meta name="description" content="The 28 aqueous amines of our GHGT-18 ePoster: 2D structures, 3D conformers you can rotate, label and measure, and CO2 solubility from experiment, a regressed eNRTL-RK model and a QM + MD prediction.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.4.0/3Dmol-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="core.js"></script>
<style>
:root { --navy: #16325C; --teal: #2A9D8F; --amber: #D98E04; --ink: #1E2B3C; --muted: #5C6B80; --line: #DCE3EC; --tint: #F4F7FB;
  --Primary: #2A9D8F; --Secondary: #D98E04; --Cyclic: #2E75B6; --Other: #8E5BB0; color-scheme: light; }
* { box-sizing: border-box; } html, body { overflow-x: hidden; }
body { margin: 0; background: #fff; color: var(--ink); font: 16px/1.6 'Source Sans 3', system-ui, sans-serif; }
a { color: var(--navy); }
header { background: var(--navy); color: #fff; padding: 12px 20px; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
header b { font-family: 'Source Serif 4', serif; font-size: 20px; } header span { opacity: .75; font-size: 14px; }
header a { color: #fff; text-decoration: none; } header .home { opacity: .75; font-size: 14px; } header .home::after { content: ' /'; }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); max-width: 1320px; margin: 0 auto; }
nav { position: sticky; top: 0; align-self: start; max-height: 100vh; overflow: auto; padding: 18px 14px; border-right: 1px solid var(--line); font-size: 14.5px; }
nav h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
nav h4 i { width: 8px; height: 8px; border-radius: 2px; }
nav a { display: block; padding: 2px 8px; border-radius: 4px; text-decoration: none; color: var(--ink); }
nav a:hover { background: var(--tint); } nav a[aria-current="true"] { background: var(--navy); color: #fff; }
main { padding: 22px 26px 60px; min-width: 0; }
h1 { font-family: 'Source Serif 4', serif; color: var(--navy); font-size: 32px; margin: 0 0 4px; line-height: 1.2; }
h2 { font-family: 'Source Serif 4', serif; color: var(--navy); font-size: 22px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--navy); }
h2 span { color: var(--teal); margin-right: 8px; }
.lead { color: var(--muted); margin: 0 0 16px; }
.over { width: 100%; border-collapse: collapse; font-size: 15px; } .over th { text-align: left; border-bottom: 2px solid var(--navy); padding: 6px 8px; } .over td { border-bottom: 1px solid var(--line); padding: 4px 8px; }
.over tr:hover td { background: var(--tint); cursor: pointer; } .over img { height: 38px; max-width: 90px; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
table.facts { border-collapse: collapse; width: 100%; font-size: 15px; } table.facts th { text-align: left; width: 120px; color: var(--muted); font-weight: 600; padding: 4px 0; vertical-align: top; } table.facts td { padding: 4px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
figure { margin: 0; border: 1px solid var(--line); padding: 12px; } figure img { width: 100%; max-height: 180px; object-fit: contain; }
figcaption { font-size: 13.5px; color: var(--muted); margin-top: 6px; } figcaption b { color: var(--ink); }
/* core */
.am-ctrl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; font-size: 14.5px; }
.am-seg { display: inline-flex; border: 1px solid var(--navy); border-radius: 4px; overflow: hidden; } .am-seg b { padding: 4px 8px; font-size: 13px; background: var(--tint); color: var(--navy); border-right: 1px solid var(--navy); }
.am-seg button { border: 0; background: #fff; color: var(--navy); padding: 4px 11px; font: inherit; font-size: 14px; cursor: pointer; } .am-seg button + button { border-left: 1px solid var(--navy); }
.am-seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.am-sel, .am-btn, .am-mini { border: 1px solid var(--navy); color: var(--navy); background: #fff; border-radius: 4px; padding: 4px 8px; font: inherit; font-size: 14px; cursor: pointer; max-width: 100%; }
.am-viewer { position: relative; height: 440px; border: 1px solid var(--line); background: #FBFCFE; touch-action: none; }
.am-readout { position: absolute; z-index: 2; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.am-readout span { background: var(--navy); color: #fff; border-radius: 3px; padding: 2px 8px; font-size: 14px; } .am-readout b { color: #FFD27A; }
.am-hint, .am-note { color: var(--muted); font-size: 13.5px; margin: 8px 0 0; }
.am-co2 { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 18px; align-items: start; }
.am-ptitle { margin: 0 0 4px; font-size: 15px; color: var(--navy); }
.am-side { display: grid; gap: 14px; font-size: 14.5px; } .am-group h5 { margin: 0 0 6px; font-size: 13px; color: var(--navy); text-transform: uppercase; letter-spacing: 1px; display: flex; gap: 6px; align-items: center; }
.am-mini { font-size: 11.5px; padding: 0 6px; text-transform: none; letter-spacing: 0; }
.am-concs, .am-srcs, .am-legend { display: grid; gap: 3px; } .am-conc, .am-src, .am-legend label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.am-conc { padding: 3px 6px; border-left: 3px solid transparent; } .am-conc:has(input:checked) { border-left-color: var(--teal); background: var(--tint); } .am-conc small { color: var(--muted); display: block; }
.am-temps { display: flex; flex-wrap: wrap; gap: 5px; } .am-chip { border: 1px solid var(--line); background: #fff; border-radius: 3px; padding: 1px 8px; font: inherit; font-size: 13px; display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.am-chip i { width: 10px; height: 10px; border-radius: 2px; } .am-chip[aria-pressed="false"] { opacity: .35; }
.am-key { width: 26px; height: 12px; color: var(--ink); } .am-shape { width: 15px; height: 15px; flex: none; color: var(--ink); }
input { accent-color: var(--navy); } .am-todo { border: 1px dashed var(--line); padding: 26px; text-align: center; color: var(--muted); }
.menu { display: none; }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13.5px; padding: 14px 20px 28px; max-width: 1320px; margin: 0 auto; }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); } nav { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); display: none; } nav.open { display: block; }
  .menu { display: inline-block; margin-left: auto; background: transparent; border: 1px solid rgba(255, 255, 255, .6); color: #fff; border-radius: 4px; padding: 3px 10px; font: inherit; }
  main { padding: 18px 16px 48px; } .top, .am-co2 { grid-template-columns: minmax(0, 1fr); } .am-viewer { height: 340px; }
  /* phone: compact controls above the chart: concentrations scroll sideways, Show and sources side by side */
  .am-side { order: -1; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 12px; font-size: 14px; }
  .am-side .am-group:nth-child(-n+2) { grid-column: 1 / -1; } .am-group h5 { margin-bottom: 4px; }
  .am-concs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; } .am-conc { flex: none; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  .am-conc:has(input:checked) { border-color: var(--teal); }
}
</style>
</head>
<body>
<header><a href="../" class="home">Amine Thermo</a><a href="#"><b>Amines studied</b></a><span>GHGT-18 ePoster · supporting information</span><button class="menu" id="menu">Index ☰</button></header>
<div class="layout"><nav id="nav"></nav><main id="app"></main></div>
<footer>Lin Research Group, Department of Chemical Engineering, National Tsing Hua University · <a href="../">Home</a> · <a href="../game/">Capture City 2050</a> · structures via <a href="https://pubchem.ncbi.nlm.nih.gov/" target="_blank" rel="noopener">PubChem</a> · 3D viewer <a href="https://3dmol.csb.pitt.edu/" target="_blank" rel="noopener">3Dmol.js</a>, charts <a href="https://www.chartjs.org/" target="_blank" rel="noopener">Chart.js</a></footer>
<script>
const app = document.getElementById('app'); let A = [];
const COLORS = { Primary: 'var(--Primary)', Secondary: 'var(--Secondary)', Cyclic: 'var(--Cyclic)', Other: 'var(--Other)' };
function nav(cur) {
  document.getElementById('nav').innerHTML = AM.CLASSES.map((c) => `<h4><i style="background:${COLORS[c]}"></i>${c === 'Other' ? 'Ammonia' : c + ' amines'}</h4>` +
    A.filter((a) => a.cls === c).map((a) => `<a href="#${encodeURIComponent(a.id)}" aria-current="${cur === a.id}">${AM.esc(a.id)} <small style="opacity:.65">${AM.esc(a.name)}</small></a>`).join('')).join('');
}
function overview() {
  app.innerHTML = `<h1>The 28 aqueous amines</h1><p class="lead">Structures, 3D conformers and CO₂ solubility for every amine in the GHGT-18 ePoster. Select an amine on the left or in the table.</p>
    <table class="over"><thead><tr><th>Structure</th><th>Amine</th><th>Class</th><th>pK<sub>a</sub> 25 °C</th><th>CO₂ points</th></tr></thead><tbody>${A.map((a) => `<tr data-id="${AM.esc(a.id)}"><td><img src="${AM.svg(a.id)}" alt=""></td><td><b>${AM.esc(a.id)}</b> · ${AM.esc(a.name)}</td><td>${a.cls}</td><td>${a.pka25.toFixed(2)}</td><td>${a.co2_points}</td></tr>`).join('')}</tbody></table>`;
  app.querySelectorAll('tbody tr').forEach((r) => r.onclick = () => { location.hash = encodeURIComponent(r.dataset.id); });
}
function detail(a) {
  const n = A.indexOf(a) + 1;
  app.innerHTML = `<h1>${AM.esc(a.id)} — ${AM.esc(a.name)}</h1><p class="lead">${a.cls} amine · entry ${n} of ${A.length}</p>
    <div class="top"><table class="facts">${AM.facts(a).map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table>
      <figure><img src="${AM.svg(a.id)}" alt="2D structure"><figcaption><b>Figure ${n}a.</b> 2D structure of ${AM.esc(a.id)}.</figcaption></figure></div>
    <h2><span>${n}.1</span>3D conformers</h2><div id="conf"></div>
    <h2><span>${n}.2</span>CO₂ solubility</h2><div id="co2"></div>`;
  AM.confPanel(app.querySelector('#conf'), a, { bg: '#FBFCFE', pick: '#D98E04', labelBg: '#16325C', labelFg: '#FFFFFF' });
  AM.co2Panel(app.querySelector('#co2'), a, { fg: '#16325C', grid: '#E6ECF3', font: 'Source Sans 3', h: 440 });
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1)), a = A.find((x) => x.id === id);
  nav(a && a.id); a ? detail(a) : overview(); document.getElementById('nav').classList.remove('open'); scrollTo(0, 0);
}
document.getElementById('menu').onclick = () => document.getElementById('nav').classList.toggle('open');
addEventListener('hashchange', route); AM.load().then((x) => { A = x; route(); });
</script>
</body>
</html>
